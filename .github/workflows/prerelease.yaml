name: prerelease

on:
  push:
    branches:
      - main

jobs:
  create-releases:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/setup@v2
        with:
          cache: true

      - name: Build userscripts
        run: pnpm -r build

      - name: Create userscript releases
        uses: LeviOP/userscript-monorepo-action@main
        with:
          userscripts-dir: userscripts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
